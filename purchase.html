<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purchases - Smart Credit Book</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            📒 Smart Credit Book
        </div>

        <nav>
    <a href="index.html">🏠 Dashboard</a>
    <a href="customers.html">👤 Customers</a>
    <a href="purchase.html" class="active">🛒 Purchases</a>
    <a href="credit.html">📒 Credit Book</a>
    
    <a href="reports.html">📊 Reports</a>
    <a href="settings.html">⚙️ Settings</a>
</nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>Purchase Entry</h1>
                <p>Record customer purchases and calculate due amount</p>
            </div>

        </header>


        <!-- Purchase Form -->
        <div class="purchase-container">

            <div class="panel">

                <h2>🛒 New Purchase</h2>

                <!-- Customer -->
                <label>Customer</label>

                
                    <select id="purchaseCustomer">
    <option value="">Select Customer</option>

                </select>


                <!-- Product -->
                <label>Product Name</label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Rice"
                >


                <!-- Quantity -->
                <label>Quantity</label>

                <input
                    type="number"
                    id="quantity"
                    placeholder="Example: 2"
                    min="1"
                    value="1"
                >


                <!-- Price -->
                <label>Price per Unit</label>

                <input
                    type="number"
                    id="price"
                    placeholder="Example: 500"
                    min="0"
                >


                <button
                    class="add-product-btn"
                    onclick="addProduct()">
                    + Add Product
                </button>

            </div>


            <!-- Purchase Summary -->
            <div class="panel">

                <h2>📋 Purchase Summary</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody id="purchaseTable">

                    </tbody>

                </table>


                <div class="purchase-total">

                    <div>
                        <span>Total Amount</span>
                        <strong id="totalAmount">₹0</strong>
                    </div>

                    <div>
                        <label>Amount Paid</label>

                        <input
                            type="number"
                            id="amountPaid"
                            value="0"
                            min="0"
                            oninput="calculateDue()"
                        >
                    </div>

                    <div class="due-row">
                        <span>Due Amount</span>
                        <strong id="dueAmount">₹0</strong>
                    </div>

                </div>


                <button
                    class="save-purchase-btn"
                    onclick="savePurchase()">
                    💾 Save Purchase
                </button>

            </div>

        </div>

    </main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
    

</body>

</html>
